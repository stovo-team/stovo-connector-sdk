services:
  connectors-host:
    build: .
    ports:
      - "${CONNECTOR_PORT:-8080}:8080"
    volumes:
      - ./examples:/connectors:ro
    environment:
      - CONNECTOR_HOST=0.0.0.0
      - CONNECTOR_PORT=8080
      - CONNECTOR_AUTH_TOKEN=${CONNECTOR_AUTH_TOKEN:-test-secret}
      - LOG_LEVEL=info
    restart: unless-stopped
